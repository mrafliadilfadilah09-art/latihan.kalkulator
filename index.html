<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff;
    font-family: Arial, Helvetica, sans-serif;
  }
  .calculator {
    width: 316px;
    padding: 16px;
    border: 2px solid #000;
    border-radius: 12px;
    background: #fff;
  }
  .display {
    height: 62px;
    margin-bottom: 14px;
    padding: 0 16px;
    border: 2px solid #000;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    font-size: 26px;
    overflow: hidden;
    white-space: nowrap;
  }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  button {
    height: 58px;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    background: #d9d9d9;
    color: #00a6f9;
    transition: filter .15s, transform .05s;
  }
  button:hover { filter: brightness(0.92); }
  button:active { transform: scale(0.96); }
  .clear  { background: #e53935; color: #fff; }
  .back   { background: #fb8c00; color: #fff; }
  .op     { background: #1017d3; color: #fff; }
  .equal  { background: #019eff; color: #fff; }
  .zero   { grid-column: span 2; }
</style>
</head>
<body>
 
<div class="calculator">
  <div class="display" id="display">0</div>
 
  <div class="buttons">
    <button class="clear" data-action="clear">C</button>
    <button class="back" data-action="back">⌫</button>
    <button class="op" data-action="percent">%</button>
    <button class="op" data-op="/">÷</button>
 
    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-op="*">×</button>
 
    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-op="-">−</button>
 
    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-op="+">+</button>
 
    <button class="zero" data-num="0">0</button>
    <button data-action="dot">.</button>
    <button class="equal" data-action="equal">=</button>
  </div>
</div>
 
<script>
  const display = document.getElementById('display');
 
  let current = '0';     // angka yang sedang diketik
  let previous = null;   // angka sebelumnya
  let operator = null;   // operator aktif
  let resetNext = false; // true setelah menekan = atau operator
 
  function show(value) {
    display.textContent = String(value).replace('.', ',') === '' ? '0' : String(value).replace('.', ',');
  }
 
  function inputNumber(n) {
    if (resetNext) { current = '0'; resetNext = false; }
    current = current === '0' ? n : current + n;
    show(current);
  }
 
  function inputDot() {
    if (resetNext) { current = '0'; resetNext = false; }
    if (!current.includes('.')) current += '.';
    show(current);
  }
 
  function calculate(a, b, op) {
    a = parseFloat(a); b = parseFloat(b);
    let r;
    switch (op) {
      case '+': r = a + b; break;
      case '-': r = a - b; break;
      case '*': r = a * b; break;
      case '/': if (b === 0) return 'Error'; r = a / b; break;
      default: return b;
    }
    return String(parseFloat(r.toFixed(10)));
  }
 
  function chooseOperator(op) {
    if (current === 'Error') return;
    if (operator && !resetNext) {
      current = calculate(previous, current, operator);
      show(current);
      if (current === 'Error') { reset(); display.textContent = 'Error'; return; }
    }
    previous = current;
    operator = op;
    resetNext = true;
  }
 
  function equal() {
    if (!operator) return;
    const result = calculate(previous, current, operator);
    operator = null;
    previous = null;
    resetNext = true;
    if (result === 'Error') { current = '0'; display.textContent = 'Error'; return; }
    current = result;
    show(current);
  }
 
  function percent() {
    current = String(parseFloat((parseFloat(current) / 100).toFixed(10)));
    show(current);
  }
 
  function backspace() {
    if (resetNext) return;
    current = current.length > 1 ? current.slice(0, -1) : '0';
    show(current);
  }
 
  function reset() {
    current = '0'; previous = null; operator = null; resetNext = false;
    show(current);
  }
 
  // Klik tombol
  document.querySelector('.buttons').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    if (btn.dataset.num !== undefined) inputNumber(btn.dataset.num);
    else if (btn.dataset.op) chooseOperator(btn.dataset.op);
    else switch (btn.dataset.action) {
      case 'clear':   reset(); break;
      case 'back':    backspace(); break;
      case 'percent': percent(); break;
      case 'dot':     inputDot(); break;
      case 'equal':   equal(); break;
    }
  });
 
  // Dukungan keyboard
  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') inputNumber(e.key);
    else if (['+', '-', '*', '/'].includes(e.key)) chooseOperator(e.key);
    else if (e.key === '.' || e.key === ',') inputDot();
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equal(); }
    else if (e.key === 'Backspace') backspace();
    else if (e.key === 'Escape' || e.key.toLowerCase() === 'c') reset();
    else if (e.key === '%') percent();
  });
</script>
</body>
</html>
